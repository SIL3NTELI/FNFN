<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Royale - Season 1</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hud">
  <div id="crosshair"></div><div id="hit"></div>
  <div id="top"><span>Alive <b id="alive">30</b></span><span>Elims <b id="elims">0</b></span></div>
  <div id="zone"></div>
  <canvas id="mini" width="150" height="150"></canvas>
  <div id="feed"></div>
  <div id="msg"></div><div id="prompt"></div>
  <div id="bottom">
    <div id="slots"></div>
    <div id="ammo"></div>
    <div id="wood"></div>
    <div class="bar"><i id="sh"></i></div>
    <div class="bar"><i id="hp"></i></div>
  </div>
</div>
<div id="overlay">
  <h1>BATTLE ROYALE</h1><h2>SEASON 1</h2>
  <button id="play">DROP IN</button>
  <pre>WASD move   Shift sprint   Space jump / leave bus
Mouse aim + fire   1-4 slots   R reload   E loot
Pickaxe: harvest wood
Q wall   F floor   C ramp   (10 wood each)
Last one standing wins.</pre>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
